services:

  mongodb:
    image: mongo:7
    container_name: careerflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: careerflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/careerflow
      JWT_SECRET: careerflow_secret_key
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: careerflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
